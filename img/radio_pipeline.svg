<circle cx="60" cy="466.75" r="2.6" fill="#38bdf8"/>
<text x="70" y="471" font-family="Inter,'Segoe UI',Arial,Helvetica,sans-serif" font-size="12.5" fill="#e2e8f0" text-anchor="start">cost discipline — dry-run plan, shared contexts, cached pair probabilities</text>
